# Despierta el backend en Render cuando lo necesites.
#
# El plan gratuito de Render suspende el servicio tras ~15 minutos sin
# tráfico, y la siguiente petición tarda entre 30 y 50 segundos. Eso solo
# molesta a quien llega primero: el frontend hace un ping al cargar cualquier
# página (src/components/system/BackendWarmup.tsx), así que el servidor
# empieza a levantarse mientras la persona todavía está leyendo la portada.
#
# Por eso este flujo NO corre en automático: mantenerlo despierto todo el día
# gastaría las horas de ejecución del plan gratuito a cambio de muy poco.
#
# Úsalo a mano desde la pestaña Actions unos 5 minutos antes de una
# sustentación o de una demostración, y el primer acceso será instantáneo.
#
# Si en algún momento sí conviene un horario fijo (por ejemplo, la semana de
# la sustentación), basta con descomentar el bloque `schedule`: pinga cada 10
# minutos entre las 08:00 y las 20:00 de Perú, de lunes a viernes.

name: Despertar el backend

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 13-23,0-1 * * 1-5"

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar el backend
        run: |
          URL="https://sanchez-tech-store-api.onrender.com/health"

          # Hasta 3 intentos: si el servicio estaba dormido, el primero puede
          # agotar el tiempo mientras Render levanta el contenedor.
          for intento in 1 2 3; do
            echo "Intento $intento -> $URL"
            codigo=$(curl -s -o /tmp/respuesta.txt -w "%{http_code}" --max-time 90 "$URL" || echo "000")

            if [ "$codigo" = "200" ]; then
              echo "Respondió 200:"
              cat /tmp/respuesta.txt
              exit 0
            fi

            echo "Respondió $codigo, reintentando en 20 s..."
            sleep 20
          done

          echo "El backend no respondió tras 3 intentos."
          exit 1
