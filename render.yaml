services:
  - type: web
    name: sanchez-tech-store-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://ecommerce-ml.vercel.app
      - key: BACKEND_URL
        value: https://sanchez-tech-store-api.onrender.com
