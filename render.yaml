# Despliegue del backend en Render (plan gratuito).
#
# Las migraciones se aplican en el build y no en el arranque a propósito: el
# plan gratuito suspende el servicio tras ~15 minutos sin tráfico y lo vuelve a
# levantar en la siguiente visita. Si el arranque tuviera que hablar con la
# base antes de servir, ese retraso se sumaría a los 30-50 segundos que ya
# tarda cada despertar. El build ocurre una sola vez por despliegue.
services:
  - type: web
    name: sanchez-tech-store-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.scripts.apply_migrations
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      # "test" o "produccion". Hay que declararlo: MercadoPago entrega hoy las
      # credenciales de PRUEBA con el prefijo "APP_USR-", el mismo que las de
      # produccion, asi que el token ya no dice de que entorno es.
      - key: MERCADOPAGO_ENTORNO
        sync: false
      # Clave del webhook: panel de MercadoPago -> Tus integraciones ->
      # Webhooks. Mientras esté vacía, la firma de las notificaciones no se
      # exige y el webhook acepta cualquier aviso.
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # Niubiz, la segunda pasarela. Con las tres puestas, el checkout ofrece
      # las dos formas de pago; sin alguna, solo MercadoPago.
      - key: NIUBIZ_USER
        sync: false
      - key: NIUBIZ_PASSWORD
        sync: false
      - key: NIUBIZ_MERCHANT_ID
        sync: false
      # "test" o "produccion". Hay que declararlo: las credenciales de Niubiz
      # no llevan marca de entorno, y de esta variable dependen las tres
      # direcciones que se usan.
      - key: NIUBIZ_ENTORNO
        value: test
      - key: SECRET_KEY
        sync: false
      # Donde se guardan las imagenes que sube el panel de administracion.
      # Panel de Cloudinary -> Dashboard -> API Environment variable, con la
      # forma cloudinary://<api_key>:<api_secret>@<cloud_name>. Sin ella las
      # imagenes se guardan en la base de datos, que aguanta pero se come el
      # espacio del plan gratuito de Neon.
      - key: CLOUDINARY_URL
        sync: false
      # Correo saliente. Sin SMTP_HOST la aplicación no envía nada: escribe el
      # mensaje en el log y sigue, así que el resto del sistema funciona igual.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://ecommerce-ml.vercel.app
      - key: BACKEND_URL
        value: https://sanchez-tech-store-api.onrender.com
